name: Build Switch Library

on:
  push:
    branches: [claude/switch-library-app]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            name: windows-x64
          - os: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            name: macos-arm64
          - os: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            name: macos-x64
          - os: ubuntu-22.04
            args: "--bundles appimage"
            name: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci || npm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: switch-library-${{ matrix.name }}
          path: |
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
