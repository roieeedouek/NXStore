[package]
name = "switch-library"
version = "0.2.0"
description = "Local web app: browse the Nintendo Switch catalog, track your collection, manage TorBox transfers"
edition = "2021"

[lib]
name = "switch_library_lib"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
futures-util = "0.3"
opener = { version = "0.8", features = ["reveal"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
